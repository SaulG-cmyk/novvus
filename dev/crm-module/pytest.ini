[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
# La política de event loop (necesaria: psycopg async requiere SelectorEventLoop
# en Windows) está deprecada en Python 3.14; pytest-asyncio 1.4 aún no expone
# loop_factory configurable. Silenciar SOLO esa deprecation hasta migrar.
filterwarnings =
    ignore:'asyncio.WindowsSelectorEventLoopPolicy' is deprecated:DeprecationWarning
    ignore:'asyncio.set_event_loop_policy' is deprecated:DeprecationWarning
