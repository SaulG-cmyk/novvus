[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "novvus-sdk"
version = "0.2.20"
description = "Declarative SDK to build NOVVUS CORE business modules"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "sqlalchemy[asyncio]>=2.0.35",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "uuid6>=2024.7.10",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-openpyxl",
    "jsonschema>=4.23",
]

[tool.mutmut]
# Mutación acotada al archivo de mayor densidad lógica; corre solo en CI Linux
# (mutmut 3 exige fork y no soporta Windows nativo — issue boxed/mutmut#397).
paths_to_mutate = ["src/novvus_sdk/manifest.py"]
tests_dir = ["tests/"]

[project.scripts]
novvus = "novvus_sdk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/novvus_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# B008: FastAPI's `Depends(...)` in parameter defaults is idiomatic.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/novvus_sdk"]

[[tool.mypy.overrides]]
module = ["uuid6.*"]
ignore_missing_imports = true
